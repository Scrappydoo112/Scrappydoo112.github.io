<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=900, initial-scale=1.0">
  <title>Combined Cookie Clicker</title>

  <!-- Styles -->
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #bigCookie {
      width: 150px;
      height: 150px;
      background-color: #d2691e;
      border-radius: 50%;
      border: 3px solid #8b4513;
      font-size: 20px;
      color: #fff;
      text-align: center;
      line-height: 150px;
      cursor: pointer;
    }

    .menu {
      margin: 20px auto;
      padding: 20px;
      border: 2px solid #ccc;
      border-radius: 10px;
      width: 300px;
      text-align: left;
      background-color: #f9f9f9;
      display: none; /* Hide menu by default */
    }

    .menu label {
      display: block;
      margin-bottom: 10px;
    }

    .menu input {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .menu button {
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .menu button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Cookie Clicker Game -->
  <h1>Cookie Clicker</h1>
  <button id="bigCookie">Big Cookie</button>
  <div id="cookieNumbers">0 Cookies</div>

  <!-- Auto Clicker GUI -->
  <div class="menu" id="menu">
    <label for="clicksPerSecond">Clicks per second:</label>
    <input type="number" id="clicksPerSecond" value="10" min="1" max="1000">

    <label for="clickSpeed">Click speed (ms per click):</label>
    <input type="number" id="clickSpeed" value="100" min="1" max="1000">

    <button id="toggleAutoClick">Start Auto-Clicker</button>
  </div>

  <!-- JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let cookies = 0;
      let autoClickerInterval = null;

      // Function to update cookie count
      function updateCookieCount() {
        document.getElementById('cookieNumbers').textContent = `${cookies} Cookies`;
      }

      // Function to toggle the menu
      function toggleMenu() {
        const menu = document.getElementById('menu');
        if (menu.style.display === 'none' || menu.style.display === '') {
          menu.style.display = 'block';
        } else {
          menu.style.display = 'none';
        }
      }

      // Listen for the 'G' key press
      document.addEventListener('keydown', function (event) {
        if (event.key.toLowerCase() === 'g') {
          toggleMenu();
        }
      });

      // Big cookie click event
      document.getElementById('bigCookie').addEventListener('click', function () {
        cookies++;
        updateCookieCount();
      });

      // Auto Clicker functionality
      document.getElementById('toggleAutoClick').addEventListener('click', function () {
        const clicksPerSecond = parseInt(document.getElementById('clicksPerSecond').value);
        const clickSpeed = 1000 / clicksPerSecond;

        if (autoClickerInterval) {
          clearInterval(autoClickerInterval);
          autoClickerInterval = null;
          this.textContent = 'Start Auto-Clicker';
        } else {
          autoClickerInterval = setInterval(() => {
            document.getElementById('bigCookie').click();
          }, clickSpeed);
          this.textContent = 'Stop Auto-Clicker';
        }
      });
    });
  </script>
</body>
</html>
